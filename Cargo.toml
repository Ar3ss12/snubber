[package]
name = "snubber"
version = "0.6.13"
edition = "2021"
# Library floor. Proven by the `msrv` CI lane (`cargo check --lib`, core /
# core+alloc / std). Tests and benches are outside this floor: the dev
# graph (criterion -> clap) needs Rust 1.74+.
rust-version = "1.70"
license = "MIT OR Apache-2.0"
description = "Transactional safety fuse and failure-recovery engine for Rust: Drop-guaranteed rollback, monotonic-epoch ordering, bulkheads, circuit breaker and flight-recorder diagnostics."
readme = "README.md"
repository = "https://github.com/Ar3ss12/snubber"
documentation = "https://docs.rs/snubber"
keywords = ["transactions", "guard", "raii", "bulkhead", "no_std"]
categories = ["concurrency", "no-std", "data-structures", "embedded"]
exclude = [
    "scripts/",
    "AGENTS.md",
    "tech.md",
    "docs/DECISION_MATRIX.md",
    "assets/",
]

# docs.rs builds with every feature so the `std`/`alloc` surfaces are all
# documented; `--cfg docsrs` is inert until a `#[cfg(docsrs)]` gate consumes it.
[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = ["std", "alloc"]
std = ["alloc"]
alloc = []

[lib]
name = "snubber"
path = "src/lib.rs"

[profile.release]
lto = true
codegen-units = 1

[dev-dependencies]
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "admission_bench"
harness = false
