name: CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  # 1. QUALITY GATE: Formatting, clippy, no_std, docs
  quality:
    name: Code Quality & no_std Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Check Formatting (cargo fmt)
        run: cargo fmt --check

      - name: Clippy Zero-Warnings Gate
        run: cargo clippy --all-targets -- -D warnings

      - name: Pure Bare-Metal Layer 1 Check (no-default-features)
        run: cargo check --no-default-features

      - name: Architectural Invariant & Compile Gates Audit
        run: bash scripts/check_compile_gates.sh

      - name: Validate Documentation Links (cargo doc)
        run: cargo doc --no-deps --all-features

      - name: Package Integrity (dry-run publish)
        run: cargo publish --dry-run

  # 2. CROSS-PLATFORM TEST SUITE: Linux, Windows, macOS
  test-matrix:
    name: Test on ${{ matrix.os }}
    needs: quality
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Run Full Test Suite
        run: cargo test

      - name: Verify Release Build Performance
        run: cargo build --release

      - name: Run Release Concurrency Stress (40,000 transactions)
        run: cargo test --release --test concurrency_stress

      - name: Run Release Hard Clamp & Bulkhead Capacity
        run: |
          cargo test --release --test bulkhead_capacity

  # 3. MIRI VERIFICATION: Formal memory model verification
  miri:
    name: Miri Memory Model Verification
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Nightly Rust with Miri
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri, rust-src

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Run Miri on Core Library
        run: cargo miri test --lib

      - name: Run Miri on Full Memory & Concurrency Suite
        env:
          MIRIFLAGS: "-Zmiri-disable-isolation -Zmiri-ignore-leaks"
        run: |
          cargo miri test --test guard
          cargo miri test --test scoped_transactions
          cargo miri test --test erased
          cargo miri test --test invariants
          cargo miri test --test memory_boundary
          cargo miri test --test circuit_breaker
          cargo miri test --test bulkhead_capacity
          cargo miri test --test channel
          cargo miri test --test conduit
          cargo miri test --test priority_preemption
          cargo miri test --test policy
          cargo miri test --test node_stats
          cargo miri test --test presets
          cargo miri test --test watchdog
          cargo miri test --test input_boundary
          cargo miri test --test backpressure
          cargo miri test --test fault_classification
          cargo miri test --test async_gate
          cargo miri test --test async_primitives
          cargo miri test --test supervisor
          cargo miri test --test supervisor_restart
          cargo miri test --test diagnostics
          cargo miri test --test task_engine
          cargo miri test --test transition_orphan
          cargo miri test --test regression_postmortems
          cargo miri test --test clock_pulse
          cargo miri test --test affordances
          cargo miri test --test channel_throttle
          cargo miri test --test frame_fuzz
          cargo miri test --test industrial
          cargo miri test --test state_handoff
          cargo miri test --test worker_lifecycle
          cargo miri test --test passthrough_canary

  # 4. BENCHMARK COMPILE CHECK: verifies bench crate compiles (no measurement on CI)
  bench-check:
    name: Benchmark Compile Check
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Check Benchmark Compiles (no measurement)
        run: cargo bench --bench admission_bench --no-run
