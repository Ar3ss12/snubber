name: CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:
  # Weekly re-run: nothing else re-checks the gates against `stable`
  # toolchain drift or dependency updates between PRs.
  schedule:
    - cron: "0 4 * * 3"

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 1. QUALITY GATE: Formatting, clippy, no_std, docs
  quality:
    name: Code Quality & no_std Gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history + tags: Gate 6 diffs the public API against the
          # last release tag via `git describe`; a depth-1 checkout makes
          # the semver gate silently SKIP.
          fetch-depth: 0

      - name: Install Stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: thumbv7em-none-eabihf

      - name: Install cargo-semver-checks (Gate 6)
        uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2
        with:
          tool: cargo-semver-checks

      - name: Rust Cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Check Formatting (cargo fmt)
        run: cargo fmt --check

      - name: Clippy Zero-Warnings Gate
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Pure Bare-Metal Layer 1 Check (no-default-features)
        run: cargo check --locked --no-default-features

      - name: TRUE no_std Gate (bare-metal target, core + alloc)
        run: |
          cargo check --locked --no-default-features --target thumbv7em-none-eabihf
          cargo check --locked --no-default-features --features alloc --target thumbv7em-none-eabihf

      - name: Architectural Invariant & Compile Gates Audit
        run: bash scripts/check_compile_gates.sh

      - name: Validate Documentation Links (cargo doc)
        # `cargo doc` exits 0 on broken intra-doc links — deny warnings
        # or the link gate is decorative.
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --locked --no-deps --all-features

      - name: Cargo.lock Freshness (--locked)
        # Cargo.lock is tracked: a stale lock must fail the PR, not
        # surface at release time.
        run: cargo metadata --locked --format-version 1 > /dev/null

      - name: Release Identity Gate (version vs tag vs CHANGELOG)
        # Catches a CHANGELOG section that was cut without a version bump,
        # a version bumped without a CHANGELOG entry, and a version behind
        # the latest tag. Tags themselves are never created here.
        run: bash scripts/check_release_tag.sh

      - name: Package Integrity (dry-run publish)
        run: cargo publish --dry-run --locked

  # 2. CROSS-PLATFORM TEST SUITE: Linux, Windows, macOS
  test-matrix:
    name: Test on ${{ matrix.os }}
    needs: quality
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full tags for the Windows PowerShell gate (Gate 6 needs a tag
          # baseline); the bare-metal target feeds Gate 5 there.
          fetch-depth: 0

      - name: Install Stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Install Bare-Metal Target (Windows gate parity)
        if: runner.os == 'Windows'
        run: rustup target add thumbv7em-none-eabihf

      - name: Install cargo-semver-checks (Windows gate parity)
        if: runner.os == 'Windows'
        uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2
        with:
          tool: cargo-semver-checks

      - name: Run Full Test Suite
        shell: bash
        env:
          CARGO_TERM_COLOR: never
        run: |
          set -o pipefail
          cargo test --locked 2>&1 | tee target/test-suite.log

      - name: Test Count Badge Gate
        # The README badge is a public claim: fail when it drifts from the
        # tests that actually ran. Parsing the log avoids a second suite run;
        # one OS suffices because the only cfg-gated tests have parallel
        # Windows/non-Windows branches.
        if: runner.os == 'Linux'
        run: bash scripts/check_test_count.sh target/test-suite.log

      - name: Surface test failures as annotations
        # Job logs need repository admin rights to download (403 without a
        # token), but check-run annotations are public. A red matrix job must
        # name the failing test and its panic without a login.
        if: failure() && hashFiles('target/test-suite.log') != ''
        shell: bash
        run: |
          grep -E "^(test .* FAILED|failures:)|panicked at" target/test-suite.log \
            | head -n 12 \
            | while IFS= read -r line; do
                printf '::error title=test failure::%s\n' "$line"
              done

      - name: Architectural Invariant Gates (PowerShell 5.1 flavor)
        # The .sh flavor never runs on Windows; without this step the
        # PS-specific gate rot would be invisible.
        if: runner.os == 'Windows'
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/check_compile_gates.ps1

      - name: Gate Flavor Parity (.sh vs .ps1)
        # Both flavors publish a machine-checkable PARITY fingerprint
        # (gates/counters/functions/metaphors). Drift between them used to
        # be invisible: each flavor was only ever run on its own OS.
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -o pipefail
          bash scripts/check_compile_gates.sh > target/gates-sh.log 2>&1 || {
            echo "::error title=gate parity::.sh flavor failed on Windows"
            cat target/gates-sh.log
            exit 1
          }
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/check_compile_gates.ps1 > target/gates-ps.log 2>&1 || {
            echo "::error title=gate parity::.ps1 flavor failed"
            cat target/gates-ps.log
            exit 1
          }
          SH_LINE="$(grep -E '^PARITY:' target/gates-sh.log | tail -n 1)"
          PS_LINE="$(grep -E '^PARITY:' target/gates-ps.log | tail -n 1)"
          echo "sh: ${SH_LINE:-<missing>}"
          echo "ps: ${PS_LINE:-<missing>}"
          if [ -z "${SH_LINE}" ] || [ -z "${PS_LINE}" ]; then
            echo "::error title=gate parity::missing PARITY fingerprint"
            exit 1
          fi
          if [ "${SH_LINE}" != "${PS_LINE}" ]; then
            echo "::error title=gate parity::flavors disagree"
            exit 1
          fi

      - name: Verify Release Build Performance
        run: cargo build --release --locked

      - name: Run Release Concurrency Stress (40,000 transactions)
        run: cargo test --release --locked --test concurrency_stress

      - name: Run Release Hard Clamp & Bulkhead Capacity
        run: cargo test --release --locked --test bulkhead_capacity

  # 2c. RELEASE IGNORED LANES: the `#[ignore]` lanes, in release mode, on
  # every push/PR. They used to live only in the Stress workflow, where a
  # time-dependent threshold could rot unnoticed until a release (0.6.9:
  # `stress_breaker_churn` asserted 10% of attempts although a tripped
  # breaker admits only one probe per HalfOpen cycle). A tag must never be
  # the first place these run.
  release-ignored:
    name: Release ignored lanes (ubuntu)
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Pool storms + breaker churn (ignored gates)
        run: |
          cargo test --release --locked \
            --test supervisor_pool_stress \
            --test supervisor_pool_stress_lease \
            --test supervisor_pool_stress_mixed \
            --test stress_breaker_churn \
            -- --ignored

      - name: Upload Pool Gate Artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pool-gates
          path: |
            target/pool_stress_report.json
            target/pool_lease_stress_report.json
            target/pool_mixed_stress_report.json
          if-no-files-found: warn
          retention-days: 14

  # Reduced-count termination lane on every push/PR: the only per-commit
  # coverage of the pid-file handshake, harness report conservation and the
  # Windows Win32 kill path. 25 kills exercises all of it without turning
  # PRs into a stress farm.
  termination-smoke:
    name: Termination smoke, 25 kills (${{ matrix.os }})
    needs: quality
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      STRESS_TARGET_KILLS: "25"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Termination stress (reduced counts)
        run: cargo test --release --locked --test supervisor_termination -- --ignored --nocapture

  # 3. MIRI VERIFICATION: Formal memory model verification.
  # Split into two parallel jobs: Miri interprets all threads on one host
  # core, so wall time = sum of suites; two runners halve the wall clock
  # at the same total minute cost.
  miri-core:
    name: Miri Memory Model Verification (core)
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Nightly Rust with Miri (pinned)
        # Pinned: a floating `@nightly` let a std change (const-promoted
        # waker vtables no longer deduplicated under Miri) fail the 0.6.9
        # release lane without a single repository change. Bump this date
        # deliberately and re-run both Miri jobs in the same commit.
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-10-09
          components: miri, rust-src

      - name: Rust Cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Run Miri on Core Library
        env:
          MIRIFLAGS: "-Zmiri-disable-isolation -Zmiri-ignore-leaks -Zmiri-strict-provenance"
        run: cargo miri test --locked --lib

      - name: Run Miri on Core Suites
        env:
          MIRIFLAGS: "-Zmiri-disable-isolation -Zmiri-ignore-leaks -Zmiri-strict-provenance"
        run: |
          cargo miri test --locked --test guard
          cargo miri test --locked --test scoped_transactions
          cargo miri test --locked --test erased
          cargo miri test --locked --test invariants
          cargo miri test --locked --test memory_boundary
          cargo miri test --locked --test circuit_breaker
          cargo miri test --locked --test bulkhead_capacity
          cargo miri test --locked --test channel
          cargo miri test --locked --test conduit
          cargo miri test --locked --test priority_preemption
          cargo miri test --locked --test policy
          cargo miri test --locked --test node_stats
          cargo miri test --locked --test presets
          cargo miri test --locked --test watchdog
          cargo miri test --locked --test input_boundary

  miri-concurrency:
    name: Miri Memory Model Verification (concurrency)
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Nightly Rust with Miri (pinned)
        # Pinned: a floating `@nightly` let a std change (const-promoted
        # waker vtables no longer deduplicated under Miri) fail the 0.6.9
        # release lane without a single repository change. Bump this date
        # deliberately and re-run both Miri jobs in the same commit.
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-10-09
          components: miri, rust-src

      - name: Rust Cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Run Miri on Concurrency Suites
        env:
          MIRIFLAGS: "-Zmiri-disable-isolation -Zmiri-ignore-leaks -Zmiri-strict-provenance"
        run: |
          cargo miri test --locked --test backpressure
          cargo miri test --locked --test fault_classification
          cargo miri test --locked --test async_gate
          cargo miri test --locked --test async_primitives
          cargo miri test --locked --test supervisor
          cargo miri test --locked --test supervisor_restart
          cargo miri test --locked --test diagnostics
          cargo miri test --locked --test task_engine
          cargo miri test --locked --test transition_orphan
          cargo miri test --locked --test regression_postmortems
          cargo miri test --locked --test clock_pulse
          cargo miri test --locked --test affordances
          cargo miri test --locked --test channel_throttle
          cargo miri test --locked --test frame_fuzz
          cargo miri test --locked --test industrial
          cargo miri test --locked --test state_handoff
          cargo miri test --locked --test worker_lifecycle
          cargo miri test --locked --test passthrough_canary

  # 3c. MIRI LEAK LANE: every lane above passes -Zmiri-ignore-leaks, so a
  # forgotten Drop is invisible there. This lane runs WITHOUT it: any heap
  # allocation still owned at process exit fails the suite.
  #
  # Excluded on purpose:
  #   * tests/channel.rs:13  -- wall-clock throttle test, needs real time
  #   * tests/task_engine.rs:271 -- wall-clock TTL margins (cfg(miri) ignore)
  #   * supervisor suites -- spawn real processes, unsupported under Miri
  miri-leaks:
    name: Miri Leak Checking (no -Zmiri-ignore-leaks)
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Nightly Rust with Miri (pinned)
        # Pinned: a floating `@nightly` let a std change (const-promoted
        # waker vtables no longer deduplicated under Miri) fail the 0.6.9
        # release lane without a single repository change. Bump this date
        # deliberately and re-run both Miri jobs in the same commit.
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-10-09
          components: miri, rust-src

      - name: Rust Cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Run Miri with leak detection
        env:
          # Deliberately no -Zmiri-ignore-leaks.
          MIRIFLAGS: "-Zmiri-disable-isolation -Zmiri-strict-provenance"
        run: |
          cargo miri test --locked --lib
          for suite in guard scoped_transactions erased invariants memory_boundary \
              circuit_breaker bulkhead_capacity conduit priority_preemption policy \
              node_stats presets watchdog input_boundary; do
            cargo miri test --locked --test "$suite"
          done

  # 4. BENCHMARK COMPILE CHECK: verifies bench crate compiles (no measurement on CI)
  bench-check:
    name: Benchmark Compile Check
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Check Benchmark Compiles (no measurement)
        run: cargo bench --locked --bench admission_bench --no-run

      # The exporter used to read `change/estimates.json` (a relative delta)
      # and publish 0.1 "ns" rows; compile-check alone never exercised it.
      # One short real benchmark produces a genuine `new/` estimate, then
      # the exporter must turn it into a latency row.
      - name: Benchmark Export Smoke (real estimate, no publish)
        run: |
          cargo bench --locked --bench admission_bench -- guard_new_commit \
            --sample-size 10 --measurement-time 1 --warm-up-time 0.5
          bash scripts/bench.sh --skip-run
          grep -q 'SnubberGuard::new + commit' target/bench/snapshot.md

  # 5. FULL BENCHMARK RUN: scheduled / manual only. PRs only compile the
  # bench crate (above); a real measurement per commit would be slow and
  # noise-dominated, but without this lane the published table is never
  # regenerated by CI at all.
  bench-full:
    name: Full Benchmark Run & Snapshot Artifact
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Run Criterion Benchmarks
        env:
          CARGO_TERM_COLOR: never
        run: cargo bench --locked --bench admission_bench

      - name: Export Snapshot (fails on an empty table)
        run: bash scripts/bench.sh --skip-run --github

      - name: Upload Benchmark Artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bench-criterion-${{ github.run_id }}
          path: |
            target/bench/snapshot.md
            target/criterion/**
          retention-days: 30
          if-no-files-found: error
