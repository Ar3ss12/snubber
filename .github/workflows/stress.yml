name: Stress

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:
  # Weekly scheduled lane for the heavy multi-lineage process storms: they
  # hard-kill real processes with 200+ kills and are too slow for every
  # push. The `#[ignore]` test lanes (pool storms, breaker churn,
  # termination smoke at 25 kills) run on every push/PR in ci.yml.
  schedule:
    - cron: "0 3 * * 1"

concurrency:
  group: stress-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  multi-lineage-posix:
    name: Multi-lineage storm (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Python Runtime
        # Assert the floor the harness needs, not just that a binary exists
        # (a 3.x < 3.8 interpreter would print a version and fail later).
        run: python3 -c 'import sys; assert sys.version_info >= (3, 8), sys.version'

      - name: Compile every Python script
        # The storms and the reporter are stdlib-only Python: a syntax error
        # in one of them used to surface as an unexplained exit code 1 inside
        # the storm step. Compiling them first names the file and the line.
        run: python3 -m py_compile scripts/*.py

      - name: Build Supervisor Example (release)
        run: cargo build --release --locked --example process_termination_loop

      - name: Storm - armed hold (true ambush gate)
        run: |
          python3 scripts/stress_multi_lineage.py \
            --lines 4 --kills-per-line 250 \
            --armed-hold --aggressive \
            --min-ambush-pct 70

      - name: Report armed-hold gates
        if: always()
        run: python3 scripts/ci_storm_summary.py armed-hold target/multi_lineage_report.json target/multi_lineage_run.log

      - name: Upload Armed-Hold Artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: multi-lineage-armed-hold-${{ matrix.os }}
          path: |
            target/multi_lineage_stats.json
            target/multi_lineage_report.json
            target/multi_lineage_run.log
            target/multi_lineage/lane_*/supervisor.out
            target/multi_lineage/lane_*/supervisor.err
          if-no-files-found: warn
          retention-days: 14

      # 8 lanes on a 2 vCPU runner is the shape BENCHMARKS.md publishes as the
      # saturation run: the dispatch tail, not the mean, is what moves.
      - name: Storm - saturation (8 lanes x 125 kills, armed hold)
        run: |
          python3 scripts/stress_multi_lineage.py \
            --lines 8 --kills-per-line 125 \
            --armed-hold --aggressive \
            --min-ambush-pct 70 \
            --stats target/multi_lineage_stats_saturation.json \
            --report target/multi_lineage_report_saturation.json \
            --log target/multi_lineage_run_saturation.log \
            --lane-root target/multi_lineage_saturation

      - name: Report saturation gates
        if: always()
        run: python3 scripts/ci_storm_summary.py saturation target/multi_lineage_report_saturation.json target/multi_lineage_run_saturation.log

      - name: Upload Saturation Artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: multi-lineage-saturation-${{ matrix.os }}
          path: |
            target/multi_lineage_stats_saturation.json
            target/multi_lineage_report_saturation.json
            target/multi_lineage_run_saturation.log
            target/multi_lineage_saturation/lane_*/supervisor.out
            target/multi_lineage_saturation/lane_*/supervisor.err
          if-no-files-found: warn
          retention-days: 14

      - name: Storm - free running (ambush/escape/stillborn split)
        run: |
          python3 scripts/stress_multi_lineage.py \
            --lines 4 --kills-per-line 500 \
            --aggressive \
            --stats target/multi_lineage_stats_free.json \
            --report target/multi_lineage_report_free.json \
            --log target/multi_lineage_run_free.log \
            --lane-root target/multi_lineage_free

      - name: Report free-running gates
        if: always()
        run: python3 scripts/ci_storm_summary.py free-running target/multi_lineage_report_free.json target/multi_lineage_run_free.log

      - name: Upload Free-Running Artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: multi-lineage-free-${{ matrix.os }}
          path: |
            target/multi_lineage_stats_free.json
            target/multi_lineage_report_free.json
            target/multi_lineage_run_free.log
            target/multi_lineage_free/lane_*/supervisor.out
            target/multi_lineage_free/lane_*/supervisor.err
          if-no-files-found: warn
          retention-days: 14

  # Per-push release ignored lanes (`pool-gates` and `termination-smoke`)
  # moved to .github/workflows/ci.yml: they must gate the main CI run, not
  # a parallel workflow that can be ignored or time out unnoticed.

  # Single-process harness: launches ONE supervisor, kills its workers
  # through the pid-file handshake and checks the JSON report (kills,
  # reaps, generation, leak gates). Scheduled/manual only -- it hammers
  # real processes and is too slow for every push.
  single-process-harness:
    name: Single-process harness (${{ matrix.os }})
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Harness - launch, arm, kill (200 kills)
        run: bash scripts/stress_harness.sh process_termination_loop 200 --launch --build --aggressive

      - name: Upload Harness Artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: stress-harness-${{ matrix.os }}
          path: |
            target/stress_stats.json
            target/termination_report.json
            target/stress_supervisor.out
            target/stress_supervisor.err
          if-no-files-found: warn
          retention-days: 14

  # Windows-only raw Win32 TerminateProcess path: the .py driver never
  # exercises it, so without this lane the PS harness rots invisibly.
  # Heavier and flakier than the POSIX storms — scheduled/manual only.
  multi-lineage-windows:
    name: Multi-lineage storm (windows, Win32 kill)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Build Supervisor Example (release)
        run: cargo build --release --locked --example process_termination_loop

      - name: Storm - armed hold (true ambush gate)
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/stress_multi_lineage.ps1 -Lines 4 -KillsPerLine 250 -ArmedHold -Aggressive -MinAmbushPct 70

      - name: Report armed-hold gates
        if: always()
        run: python scripts/ci_storm_summary.py armed-hold target/multi_lineage_report.json target/multi_lineage_run.log

      # The saturation shape BENCHMARKS.md quotes from the host: twice the
      # lineages over the same kill budget, so the dispatch tail is the signal.
      - name: Storm - saturation (8 lanes x 125 kills, armed hold)
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/stress_multi_lineage.ps1 -Lines 8 -KillsPerLine 125 -ArmedHold -Aggressive -MinAmbushPct 70 -StatsPath target/multi_lineage_stats_saturation.json -ReportPath target/multi_lineage_report_saturation.json -LogPath target/multi_lineage_run_saturation.log -LaneRoot target/multi_lineage_saturation

      - name: Report saturation gates
        if: always()
        run: python scripts/ci_storm_summary.py saturation target/multi_lineage_report_saturation.json target/multi_lineage_run_saturation.log

      # The .ps1 single-process harness is a separate implementation: the
      # Python driver never exercises it, so it rots without this step.
      - name: Single-process harness (PS flavor, 100 kills)
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/stress_harness.ps1 process_termination_loop 100 -Launch -Build -Aggressive

      - name: Upload Armed-Hold Artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: multi-lineage-armed-hold-windows
          path: |
            target/multi_lineage_stats.json
            target/multi_lineage_report.json
            target/multi_lineage_run.log
            target/multi_lineage/lane_*/supervisor.out
            target/multi_lineage/lane_*/supervisor.err
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Saturation Artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: multi-lineage-saturation-windows
          path: |
            target/multi_lineage_stats_saturation.json
            target/multi_lineage_report_saturation.json
            target/multi_lineage_run_saturation.log
            target/multi_lineage_saturation/lane_*/supervisor.out
            target/multi_lineage_saturation/lane_*/supervisor.err
          if-no-files-found: warn
          retention-days: 14

  # The pool storms and breaker churn moved to `pool-gates` (per push/PR).
  # What remains here spawns a background supervisor plus a killer thread
  # and is scheduled/manual only.
  termination-gate:
    name: Termination storm (cargo test -- --ignored)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Run the #[ignore] termination stress gate
        run: |
          cargo test --release --locked \
            --test supervisor_termination \
            -- --ignored
