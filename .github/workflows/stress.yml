name: Stress

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:
  # Weekly scheduled lane for the `#[ignore]` pool-stress gates: they
  # hard-kill real processes and are too heavy (and too flaky on shared
  # runners) for every push — but they are the ONLY coverage for lane
  # lease euthanasia and pool hard-kill, so they must not be manual-only.
  schedule:
    - cron: "0 3 * * 1"

concurrency:
  group: stress-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  multi-lineage-posix:
    name: Multi-lineage storm (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Python Runtime
        run: python3 --version

      - name: Build Supervisor Example (release)
        run: cargo build --release --locked --example process_termination_loop

      - name: Storm - armed hold (true ambush gate)
        run: |
          python3 scripts/stress_multi_lineage.py \
            --lines 4 --kills-per-line 250 \
            --armed-hold --aggressive \
            --min-ambush-pct 70

      - name: Upload Armed-Hold Artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: multi-lineage-armed-hold-${{ matrix.os }}
          path: |
            target/multi_lineage_stats.json
            target/multi_lineage_report.json
            target/multi_lineage/lane_*/supervisor.out
          if-no-files-found: warn
          retention-days: 14

      - name: Storm - free running (ambush/escape/stillborn split)
        run: |
          python3 scripts/stress_multi_lineage.py \
            --lines 4 --kills-per-line 500 \
            --aggressive \
            --stats target/multi_lineage_stats_free.json \
            --report target/multi_lineage_report_free.json

      - name: Upload Free-Running Artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: multi-lineage-free-${{ matrix.os }}
          path: |
            target/multi_lineage_stats_free.json
            target/multi_lineage_report_free.json
          if-no-files-found: warn
          retention-days: 14

  # Windows-only raw Win32 TerminateProcess path: the .py driver never
  # exercises it, so without this lane the PS harness rots invisibly.
  # Heavier and flakier than the POSIX storms — scheduled/manual only.
  multi-lineage-windows:
    name: Multi-lineage storm (windows, Win32 kill)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Build Supervisor Example (release)
        run: cargo build --release --locked --example process_termination_loop

      - name: Storm - armed hold (true ambush gate)
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/stress_multi_lineage.ps1 -Lines 4 -KillsPerLine 250 -ArmedHold -Aggressive -MinAmbushPct 70

      - name: Upload Armed-Hold Artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: multi-lineage-armed-hold-windows
          path: |
            target/multi_lineage_stats.json
            target/multi_lineage_report.json
            target/multi_lineage/lane_*/supervisor.out
          if-no-files-found: warn
          retention-days: 14

  ignored-stress-gates:
    name: Ignored stress gates (cargo test -- --ignored)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Run all #[ignore] stress gates
        run: |
          cargo test --release \
            --test supervisor_pool_stress \
            --test supervisor_pool_stress_lease \
            --test supervisor_pool_stress_mixed \
            --test supervisor_termination \
            -- --ignored
